<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة صقر للألعاب التفاعلية</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 2rem; max-width: 800px; margin: 0 auto; }
    h1 { color: #38bdf8; text-align: center; }
    .card { background: #1e293b; padding: 1.5rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #334155; }
    button { background: #0284c7; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; width: 100%; }
    button:hover { background: #0369a1; }
    input, select { padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; width: 100%; box-sizing: border-box; margin-bottom: 1rem; }
    .game-item { background: #334155; padding: 0.75rem; border-radius: 6px; margin-top: 0.5rem; display: flex; justify-content: space-between; }
    #log { background: #000; padding: 1rem; border-radius: 6px; color: #4ade80; font-family: monospace; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; }
  </style>
</head>
<body>

  <h1>🦅 منصة صقر للألعاب</h1>

  <!-- 1. قائمة الألعاب -->
  <div class="card">
    <h2>الألعاب المتاحة</h2>
    <button onclick="fetchGames()">تحديث قائمة الألعاب</button>
    <div id="games-list" style="margin-top: 1rem;">في انتظار جلب الألعاب...</div>
  </div>

  <!-- 2. إنشاء غرفة -->
  <div class="card">
    <h2>إنشاء غرفة جديدة</h2>
    <input type="text" id="create-host" placeholder="اسم المستضيف (مثال: عبد العزيز)">
    <select id="create-game-id">
      <option value="">اختر اللعبة...</option>
    </select>
    <button onclick="handleCreateRoom()">إنشاء الغرفة</button>
  </div>

  <!-- 3. الانضمام لغرفة -->
  <div class="card">
    <h2>الانضمام لغرفة</h2>
    <input type="text" id="join-code" placeholder="كود الغرفة المكون من 6 أرقام">
    <input type="text" id="join-name" placeholder="اسمك">
    <button onclick="handleJoinRoom()">انضمام</button>
  </div>

  <!-- سجل الاستجابات -->
  <div class="card">
    <h2>سجل الاستجابة (API Output)</h2>
    <div id="log">في انتظار الأوامر...</div>
  </div>

  <script>
    const API_BASE = 'https://saqrr.sindazon.workers.dev';

    function log(data) {
      document.getElementById('log').innerText = JSON.stringify(data, null, 2);
    }

    // جلب قائمة الألعاب
    async function fetchGames() {
      try {
        const res = await fetch(`${API_BASE}/api/games`);
        const data = await res.json();
        log(data);

        if (data.success && data.data) {
          const listDiv = document.getElementById('games-list');
          const selectDiv = document.getElementById('create-game-id');
          
          listDiv.innerHTML = '';
          selectDiv.innerHTML = '<option value="">اختر اللعبة...</option>';

          data.data.forEach(game => {
            listDiv.innerHTML += `
              <div class="game-item">
                <span><b>#${game.id}</b> - ${game.title} (${game.category})</span>
                <span>⭐ ${game.rating}</span>
              </div>
            `;
            selectDiv.innerHTML += `<option value="${game.id}">${game.title} (#${game.id})</option>`;
          });
        }
      } catch (err) {
        log({ error: 'تعذر الاتصال بخادم السحابة: ' + err.message });
      }
    }

    // التعامل مع إنشاء الغرفة
    async function handleCreateRoom() {
      const host_name = document.getElementById('create-host').value.trim();
      const game_id = parseInt(document.getElementById('create-game-id').value);

      if (!host_name || !game_id) {
        alert('يرجى كتابة الاسم واختيار اللعبة');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/rooms/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ game_id, host_name })
        });
        const data = await res.json();
        log(data);
        if (data.success) {
          alert(`تم إنشاء الغرفة بنجاح! كود الغرفة: ${data.room.room_code}`);
        } else {
          alert('خطأ: ' + (data.message || data.error));
        }
      } catch (err) {
        log({ error: err.message });
      }
    }

    // التعامل مع الانضمام لغرفة
    async function handleJoinRoom() {
      const room_code = document.getElementById('join-code').value.trim();
      const player_name = document.getElementById('join-name').value.trim();

      if (!room_code || !player_name) {
        alert('يرجى كتابة الاسم وكود الغرفة');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/rooms/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room_code, player_name })
        });
        const data = await res.json();
        log(data);
        if (data.success) {
          alert(`تم الانضمام بنجاح كـ: ${data.player.player_name}`);
        } else {
          alert('خطأ: ' + (data.message || data.error));
        }
      } catch (err) {
        log({ error: err.message });
      }
    }

    // جلب الألعاب تلقائياً عند تحميل الصفحة
    window.addEventListener('DOMContentLoaded', fetchGames);
  </script>
</body>
</html>
