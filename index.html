<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة صقر للألعاب | SAQR GAMING</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="منصة صقر للألعاب التفاعلية الجماعية">
  <meta property="og:title" content="منصة صقر للألعاب">
  <meta property="og:description" content="أنشئ غرفتك وتحدى أصدقاءك مباشرة عبر منصة صقر">
  <meta property="og:type" content="website">
  <link rel="manifest" href="/manifest.json">

  <!-- Font Awesome 6.4.0 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: #121824;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-cyan: #06b6d4;
      --primary-hover: #0891b2;
      --accent-purple: #a855f7;
      --accent-gold: #f59e0b;
      --text-light: #f8fafc;
      --text-dim: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
    }

    .app-container {
      width: 100%;
      max-width: 950px;
    }

    /* Header Design */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    .logo-box {
      display: inline-flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.5rem;
    }

    .logo-box i {
      font-size: 2.5rem;
      color: var(--primary-cyan);
      filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.5));
    }

    header h1 {
      font-family: 'Changa', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, var(--primary-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-dim);
      font-size: 1rem;
    }

    /* Cards Layout */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-family: 'Changa', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-light);
    }

    .card-title i {
      color: var(--primary-cyan);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* Inputs & Forms */
    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-dim);
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
    }

    input, select {
      width: 100%;
      padding: 0.85rem 2.8rem 0.85rem 1rem;
      background: #090d16;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: var(--text-light);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary-cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
    }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 0.9rem;
      border: none;
      border-radius: 12px;
      background: var(--primary-cyan);
      color: #000;
      font-family: 'Changa', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-light);
    }

    .btn-outline:hover {
      border-color: var(--primary-cyan);
      color: var(--primary-cyan);
      background: rgba(6, 182, 212, 0.05);
    }

    /* Game Selector Grid */
    .games-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .game-item {
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .game-item:hover {
      border-color: var(--primary-cyan);
      transform: translateY(-2px);
    }

    .game-item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .game-item-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .game-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      background: rgba(6, 182, 212, 0.1);
      color: var(--primary-cyan);
    }

    /* Lobby View */
    .lobby-header {
      text-align: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 1.5rem;
    }

    .room-code-card {
      display: inline-flex;
      align-items: center;
      gap: 1.5rem;
      background: #090d16;
      border: 2px dashed var(--primary-cyan);
      padding: 0.8rem 2rem;
      border-radius: 50px;
      margin: 1rem 0;
    }

    .room-code-num {
      font-family: 'Changa', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--primary-cyan);
      letter-spacing: 4px;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .player-card {
      background: #090d16;
      border: 1px solid var(--card-border);
      padding: 0.9rem 1.2rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-weight: 700;
    }

    .player-card.host-card {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }

    .view-section { display: none; }
    .view-section.active { display: block; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="logo-box">
        <i class="fa-solid fa-gamepad"></i>
        <h1>منصة صقر</h1>
      </div>
      <p>منصة ألعاب مباشرة وتنافسية مع الأصدقاء</p>
    </header>

    <!-- Main Home View -->
    <main id="home-view" class="view-section active">
      <div class="grid-2">
        
        <!-- Create Room -->
        <div class="card">
          <div class="card-title">
            <i class="fa-solid fa-plus-circle"></i>
            <span>إنشاء غرفة جديدة</span>
          </div>
          <div class="form-group">
            <label>اسمك في اللعبة</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user"></i>
              <input type="text" id="create-host-name" placeholder="مثال: صقر_99">
            </div>
          </div>
          <div class="form-group">
            <label>اختر اللعبة</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-chess"></i>
              <select id="create-game-select">
                <option value="">جاري تحميل الألعاب...</option>
              </select>
            </div>
          </div>
          <button class="btn" onclick="executeCreateRoom()">
            <i class="fa-solid fa-rocket"></i> إنشاء الغرفة
          </button>
        </div>

        <!-- Join Room -->
        <div class="card">
          <div class="card-title">
            <i class="fa-solid fa-right-to-bracket"></i>
            <span>الانضمام لغرفة قائمة</span>
          </div>
          <div class="form-group">
            <label>كود الغرفة</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-key"></i>
              <input type="text" id="join-room-code" placeholder="أدخل 6 أرقام" maxlength="6">
            </div>
          </div>
          <div class="form-group">
            <label>اسمك في اللعبة</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user-tag"></i>
              <input type="text" id="join-player-name" placeholder="مثال: البطل">
            </div>
          </div>
          <button class="btn btn-outline" onclick="executeJoinRoom()">
            <i class="fa-solid fa-bolt"></i> انضمام الآن
          </button>
        </div>

      </div>

      <!-- Games Showcase -->
      <div class="card">
        <div class="card-title">
          <i class="fa-solid fa-fire"></i>
          <span>الألعاب المتوفرة</span>
        </div>
        <div id="games-list-container" class="games-list">
          <div style="color: var(--text-dim); text-align: center; grid-column: 1/-1; padding: 1rem;">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري جلب الألعاب...
          </div>
        </div>
      </div>
    </main>

    <!-- Lobby View -->
    <section id="lobby-view" class="view-section">
      <div class="card">
        <div class="lobby-header">
          <span id="selected-game-label" style="color: var(--text-dim); font-size: 0.9rem; font-weight: 700;">اسم اللعبة</span>
          <div class="room-code-card">
            <span id="display-room-code" class="room-code-num">------</span>
            <button class="btn btn-outline" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.85rem;" onclick="copyRoomCode()">
              <i class="fa-solid fa-copy"></i> نسخ
            </button>
          </div>
          <p style="color: var(--text-dim); font-size: 0.85rem;">شارك هذا الكود مع زملائك لدخول الغرفة</p>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
          <h3 style="font-family: 'Changa', sans-serif;">المتواجدون بالغرفة</h3>
          <span class="game-badge" id="players-counter">0 لاعبين</span>
        </div>

        <div id="players-list" class="players-grid"></div>

        <div class="grid-2" style="margin-top: 2rem;">
          <button class="btn btn-outline" onclick="exitLobby()">
            <i class="fa-solid fa-arrow-right-from-bracket"></i> مغادرة
          </button>
          <button id="start-game-btn" class="btn" onclick="startSession()">
            <i class="fa-solid fa-play"></i> بدء اللعبة
          </button>
        </div>
      </div>
    </section>
  </div>

  <script>
    // Express API Server Endpoint
    const API_ENDPOINT = 'https://saqrr.sindazon.workers.dev';

    let currentRoomState = null;
    let localPlayer = null;
    let syncTimer = null;

    function switchView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    // Load available games
    async function fetchGames() {
      try {
        const response = await fetch(`${API_ENDPOINT}/api/games`);
        const json = await response.json();

        const selectEl = document.getElementById('create-game-select');
        const containerEl = document.getElementById('games-list-container');

        if (json.success && json.data && json.data.length > 0) {
          selectEl.innerHTML = '<option value="">اختر لعبة من القائمة...</option>';
          containerEl.innerHTML = '';

          json.data.forEach(game => {
            selectEl.innerHTML += `<option value="${game.id}">${game.title}</option>`;
            containerEl.innerHTML += `
              <div class="game-item" onclick="quickSelectGame('${game.id}')">
                <div class="game-item-header">
                  <span class="game-item-title">${game.title}</span>
                  <span class="game-badge"><i class="fa-solid fa-star"></i> ${game.rating || '5.0'}</span>
                </div>
                <span style="font-size: 0.8rem; color: var(--text-dim);">${game.category || 'عام'}</span>
              </div>
            `;
          });
        } else {
          // Fallback mock games if DB returned empty
          populateFallbackGames();
        }
      } catch (err) {
        console.warn('استخدام الخيار البديل لحفظ استقرار الواجهة');
        populateFallbackGames();
      }
    }

    function populateFallbackGames() {
      const games = [
        { id: '1', title: 'تحدي المعرفة الرقمية', category: 'أسئلة' },
        { id: '2', title: 'سرعة البديهة', category: 'تفاعلي' }
      ];
      const selectEl = document.getElementById('create-game-select');
      const containerEl = document.getElementById('games-list-container');

      selectEl.innerHTML = '<option value="">اختر لعبة...</option>';
      containerEl.innerHTML = '';

      games.forEach(g => {
        selectEl.innerHTML += `<option value="${g.id}">${g.title}</option>`;
        containerEl.innerHTML += `
          <div class="game-item" onclick="quickSelectGame('${g.id}')">
            <div class="game-item-header">
              <span class="game-item-title">${g.title}</span>
              <span class="game-badge">${g.category}</span>
            </div>
          </div>
        `;
      });
    }

    function quickSelectGame(gameId) {
      document.getElementById('create-game-select').value = gameId;
      document.getElementById('create-host-name').focus();
    }

    // Create Room Logic
    async function executeCreateRoom() {
      const hostName = document.getElementById('create-host-name').value.trim();
      const gameId = document.getElementById('create-game-select').value;

      if (!hostName || !gameId) {
        alert('يرجى كتابة الاسم واختيار اللعبة أولاً');
        return;
      }

      const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

      currentRoomState = {
        room_code: generatedCode,
        host_name: hostName,
        game_id: gameId
      };

      localPlayer = {
        name: hostName,
        is_host: true
      };

      openLobby();
    }

    // Join Room Logic
    async function executeJoinRoom() {
      const code = document.getElementById('join-room-code').value.trim();
      const playerName = document.getElementById('join-player-name').value.trim();

      if (!code || !playerName) {
        alert('يرجى أدخال كود الغرفة واسمك');
        return;
      }

      currentRoomState = {
        room_code: code,
        host_name: 'المستضيف',
        game_id: '1'
      };

      localPlayer = {
        name: playerName,
        is_host: false
      };

      openLobby();
    }

    function openLobby() {
      switchView('lobby-view');
      document.getElementById('display-room-code').innerText = currentRoomState.room_code;
      
      const startBtn = document.getElementById('start-game-btn');
      startBtn.style.display = localPlayer.is_host ? 'flex' : 'none';

      refreshPlayersList();
    }

    function refreshPlayersList() {
      const listEl = document.getElementById('players-list');
      const counterEl = document.getElementById('players-counter');

      listEl.innerHTML = '';

      // Primary Host Card
      listEl.innerHTML += `
        <div class="player-card host-card">
          <i class="fa-solid fa-crown"></i>
          <span>${currentRoomState.host_name}</span>
        </div>
      `;

      if (!localPlayer.is_host) {
        listEl.innerHTML += `
          <div class="player-card">
            <i class="fa-solid fa-user"></i>
            <span>${localPlayer.name}</span>
          </div>
        `;
        counterEl.innerText = '2 لاعبين';
      } else {
        counterEl.innerText = '1 لاعب';
      }
    }

    function copyRoomCode() {
      const code = document.getElementById('display-room-code').innerText;
      navigator.clipboard.writeText(code);
      alert('تم نسخ الكود: ' + code);
    }

    function exitLobby() {
      currentRoomState = null;
      localPlayer = null;
      switchView('home-view');
    }

    function startSession() {
      alert('جاري بدء الجلسة التفاعلية مع السيرفر...');
    }

    // Register PWA Service Worker if supported
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }

    window.addEventListener('DOMContentLoaded', fetchGames);
  </script>
</body>
</html>
