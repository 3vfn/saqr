<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة صقر للألعاب التفاعلية 🦅</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

    :root {
      --bg-dark: #080b11;
      --bg-surface: #111827;
      --bg-card: rgba(17, 24, 39, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: #38bdf8;
      
      --neon-cyan: #38bdf8;
      --neon-purple: #a855f7;
      --neon-gold: #f59e0b;
      --neon-green: #22c55e;
      --neon-red: #ef4444;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 20% 20%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(168, 85, 247, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 900px; }

    /* الهيدر الرئيسي */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff 0%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
      letter-spacing: -1px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 0.4rem;
    }

    /* الكروت الأساسية */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.8rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transition: border-color 0.3s ease;
    }

    .card:hover {
      border-color: rgba(56, 189, 248, 0.2);
    }

    h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* إدخالات البيانات */
    .input-group {
      margin-bottom: 1.2rem;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 0.95rem 1.1rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      background: rgba(8, 11, 17, 0.6);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus, select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
      background: rgba(8, 11, 17, 0.9);
    }

    /* الأزرار الاحترافية */
    button {
      width: 100%;
      padding: 1rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(2, 132, 199, 0.45);
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      box-shadow: none;
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    /* شبكة الألعاب المصممة كـ Gaming Cards */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.2rem;
    }

    .game-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.2rem;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .game-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0; bottom: 0; left: 0;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .game-card:hover {
      border-color: var(--neon-cyan);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .game-card:hover::before {
      opacity: 1;
    }

    .game-title {
      font-weight: 700;
      color: #fff;
      font-size: 1.1rem;
      position: relative;
      z-index: 1;
    }

    .game-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .badge {
      background: rgba(56, 189, 248, 0.1);
      color: var(--neon-cyan);
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* شاشة اللوبي الحديثة */
    .lobby-header {
      text-align: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .room-code-badge {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      background: rgba(56, 189, 248, 0.05);
      border: 1px dashed var(--neon-cyan);
      padding: 0.6rem 1.8rem;
      border-radius: 50px;
      margin: 1.2rem 0;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
    }

    .room-code-text {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--neon-cyan);
      letter-spacing: 4px;
    }

    .players-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .player-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 0.9rem 1.1rem;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .player-chip.host {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
      color: #fef08a;
    }

    /* الشاشات التفاعلية */
    .view { display: none; opacity: 0; transition: opacity 0.3s ease; }
    .view.active { display: block; opacity: 1; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🦅 منصة صقر للألعاب</h1>
      <p>اختر لعبتك، أنشئ غرفتك، والتحدي يبدأ فوراً</p>
    </header>

    <!-- الشاشة الرئيسية -->
    <div id="home-view" class="view active">
      
      <div class="grid-2">
        <!-- إنشاء غرفة -->
        <div class="card">
          <h2>🎯 إنشاء غرفة جديدة</h2>
          
          <div class="input-group">
            <label>اسم المستضيف</label>
            <input type="text" id="create-host" placeholder="أدخل اسمك هنا...">
          </div>

          <div class="input-group">
            <label>اختر اللعبة</label>
            <select id="create-game-id">
              <option value="">جاري تحميل الألعاب...</option>
            </select>
          </div>

          <button onclick="handleCreateRoom()">إنشاء الغرفة والدخول 🚀</button>
        </div>

        <!-- الانضمام لغرفة -->
        <div class="card">
          <h2>🔑 الانضمام لغرفة</h2>

          <div class="input-group">
            <label>كود الغرفة</label>
            <input type="text" id="join-code" placeholder="أدخل الكود (6 أرقام)..." maxlength="6">
          </div>

          <div class="input-group">
            <label>اسم اللاعب</label>
            <input type="text" id="join-name" placeholder="أدخل اسمك هنا...">
          </div>

          <button class="secondary" onclick="handleJoinRoom()">انضمام للغرفة ⚡</button>
        </div>
      </div>

      <!-- استعراض الألعاب -->
      <div class="card">
        <h2>🎮 الألعاب المتاحة</h2>
        <div id="games-container" class="games-grid">
          <div style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 2rem;">
            جاري جلب قائمة الألعاب المتاحة...
          </div>
        </div>
      </div>

    </div>

    <!-- شاشة اللوبي (Lobby View) -->
    <div id="lobby-view" class="view">
      <div class="card">
        <div class="lobby-header">
          <span id="lobby-game-title" style="color: var(--text-muted); font-size: 0.95rem; font-weight: 700;">اسم اللعبة</span>
          
          <div class="room-code-badge">
            <span id="lobby-code" class="room-code-text">------</span>
            <button onclick="copyCode()" class="secondary" style="width: auto; padding: 0.4rem 0.8rem; font-size: 0.8rem; border-radius: 20px;">
              📋 نسخ
            </button>
          </div>
          <p style="color: var(--text-muted); font-size: 0.9rem;">شارك هذا الكود مع أصدقائك للانضمام المباشر</p>
        </div>

        <h3 style="font-size: 1.1rem; color: var(--text-main);">اللاعبون المتواجدون (<span id="players-count" style="color: var(--neon-cyan);">0</span>)</h3>
        <div id="players-container" class="players-list">
          <!-- قائمة اللاعبين المحدثة ديناميكياً -->
        </div>

        <div class="grid-2" style="margin-top: 2rem;">
          <button class="secondary" onclick="leaveRoom()">مغادرة الغرفة</button>
          <button id="start-game-btn" onclick="startGame()">بدء اللعبة الآن 🔥</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const API_BASE = 'https://saqrr.sindazon.workers.dev';
    let currentRoom = null;
    let currentPlayer = null;
    let lobbyInterval = null;

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    async function loadGames() {
      try {
        const res = await fetch(`${API_BASE}/api/games`);
        const result = await res.json();

        if (result.success && result.data) {
          const select = document.getElementById('create-game-id');
          const grid = document.getElementById('games-container');
          
          select.innerHTML = '<option value="">اختر اللعبة من القائمة...</option>';
          grid.innerHTML = '';

          result.data.forEach(game => {
            select.innerHTML += `<option value="${game.id}">${game.title}</option>`;

            grid.innerHTML += `
              <div class="game-card" onclick="selectGame(${game.id})">
                <div class="game-title">${game.title}</div>
                <div class="game-meta">
                  <span class="badge">${game.category || 'عام'}</span>
                  <span style="color: #fef08a; font-weight: 700;">⭐ ${game.rating || 5.0}</span>
                </div>
              </div>
            `;
          });
        }
      } catch (err) {
        console.error('خطأ في جلب الألعاب:', err);
      }
    }

    function selectGame(gameId) {
      document.getElementById('create-game-id').value = gameId;
      document.getElementById('create-host').focus();
    }

    async function handleCreateRoom() {
      const host_name = document.getElementById('create-host').value.trim();
      const game_id = document.getElementById('create-game-id').value;

      if (!host_name || !game_id) {
        alert('يرجى تحديد اسم المستضيف واختيار لعبة');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/rooms/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ game_id, host_name })
        });
        const result = await res.json();

        if (result.success) {
          currentRoom = result.room;
          currentPlayer = { player_name: host_name, is_host: true };
          enterLobby();
        } else {
          alert('خطأ: ' + result.message);
        }
      } catch (err) {
        alert('تعذر الاتصال بالخادم');
      }
    }

    async function handleJoinRoom() {
      const room_code = document.getElementById('join-code').value.trim();
      const player_name = document.getElementById('join-name').value.trim();

      if (!room_code || !player_name) {
        alert('يرجى كتابة كود الغرفة واسمك');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/rooms/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room_code, player_name })
        });
        const result = await res.json();

        if (result.success) {
          currentRoom = result.room;
          currentPlayer = result.player;
          enterLobby();
        } else {
          alert('خطأ: ' + result.message);
        }
      } catch (err) {
        alert('تعذر الاتصال بالخادم');
      }
    }

    function enterLobby() {
      showView('lobby-view');
      document.getElementById('lobby-code').innerText = currentRoom.room_code;
      
      const startBtn = document.getElementById('start-game-btn');
      if (currentPlayer && currentPlayer.is_host) {
        startBtn.style.display = 'flex';
      } else {
        startBtn.style.display = 'none';
      }

      fetchLobbyPlayers();
      lobbyInterval = setInterval(fetchLobbyPlayers, 2500);
    }

    // دالة آمنة تمنع خطأ undefined عند جلب الاسم
    async function fetchLobbyPlayers() {
      if (!currentRoom) return;

      try {
        const container = document.getElementById('players-container');
        const hostName = currentRoom.host_name || (currentPlayer ? currentPlayer.player_name : 'المستضيف');

        document.getElementById('players-count').innerText = '1';
        
        container.innerHTML = `
          <div class="player-chip host">
            👑 ${hostName} (المستضيف)
          </div>
        `;
      } catch (err) {
        console.error('خطأ في تحديث اللاعبين:', err);
      }
    }

    function copyCode() {
      const code = document.getElementById('lobby-code').innerText;
      navigator.clipboard.writeText(code);
      alert('تم نسخ كود الغرفة: ' + code);
    }

    function leaveRoom() {
      clearInterval(lobbyInterval);
      currentRoom = null;
      currentPlayer = null;
      showView('home-view');
    }

    function startGame() {
      alert('سيتم إطلاق شاشة الأسئلة واللعب التفاعلي في التحديث القادم!');
    }

    window.addEventListener('DOMContentLoaded', loadGames);
  </script>
</body>
</html>
