<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة صقر | SAQR GAMING</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Changa:wght@400;600;800&family=Tajawal:wght@400;700;900&display=swap');

    :root {
      --bg-dark: #060913;
      --card-bg: rgba(15, 23, 42, 0.75);
      --card-border: rgba(56, 189, 248, 0.15);
      --neon-cyan: #38bdf8;
      --neon-purple: #c084fc;
      --neon-amber: #fbbf24;
      --neon-green: #4ade80;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 100%, rgba(192, 132, 252, 0.08) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container { width: 100%; max-width: 900px; }

    /* الهيدر */
    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    header h1 {
      font-family: 'Changa', sans-serif;
      font-size: 3.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 30%, var(--neon-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
      letter-spacing: -1px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 0.3rem;
    }

    /* الكروت */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 2rem;
      margin-bottom: 1.8rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; right: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    }

    h2 {
      font-family: 'Changa', sans-serif;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* الحقول والإدخال */
    .field-group {
      margin-bottom: 1.2rem;
    }

    .field-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(6, 9, 19, 0.8);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    /* الأزرار */
    button {
      width: 100%;
      padding: 1rem;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      font-family: 'Changa', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      box-shadow: 0 10px 25px rgba(2, 132, 199, 0.35);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(2, 132, 199, 0.5);
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      box-shadow: none;
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--neon-cyan);
    }

    /* بطاقات الألعاب */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.2rem;
    }

    .game-card {
      background: rgba(6, 9, 19, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 1.3rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .game-card:hover {
      border-color: var(--neon-cyan);
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2);
      background: rgba(15, 23, 42, 0.9);
    }

    .game-title {
      font-family: 'Changa', sans-serif;
      font-weight: 600;
      font-size: 1.15rem;
      color: #fff;
    }

    .game-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    .badge {
      background: rgba(56, 189, 248, 0.1);
      color: var(--neon-cyan);
      padding: 0.3rem 0.7rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* اللوبي */
    .lobby-box {
      text-align: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 1.5rem;
    }

    .code-display {
      display: inline-flex;
      align-items: center;
      gap: 1rem;
      background: rgba(56, 189, 248, 0.08);
      border: 2px dashed var(--neon-cyan);
      padding: 0.8rem 2rem;
      border-radius: 50px;
      margin: 1.2rem 0;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }

    .code-number {
      font-family: 'Changa', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--neon-cyan);
      letter-spacing: 5px;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0;
    }

    .player-tag {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 1rem;
      border-radius: 16px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
    }

    .player-tag.host {
      border-color: rgba(251, 191, 36, 0.5);
      background: rgba(251, 191, 36, 0.08);
      color: #fef08a;
    }

    .view { display: none; }
    .view.active { display: block; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🦅 منصة صقر للألعاب</h1>
      <p>اختر اللعبة، أنشئ غرفتك، واستمتع بالتحدي المباشر</p>
    </header>

    <!-- الرئيسية -->
    <div id="home-view" class="view active">
      <div class="grid-2">
        
        <!-- إنشاء غرفة -->
        <div class="card">
          <h2>🎯 إنشاء غرفة جديدة</h2>
          <div class="field-group">
            <label>اسم المستضيف</label>
            <input type="text" id="create-host" placeholder="أدخل اسمك...">
          </div>
          <div class="field-group">
            <label>اختر اللعبة</label>
            <select id="create-game-id">
              <option value="">جاري تحميل الألعاب...</option>
            </select>
          </div>
          <button onclick="handleCreateRoom()">إنشاء الغرفة 🚀</button>
        </div>

        <!-- الانضمام لغرفة -->
        <div class="card">
          <h2>🔑 الانضمام لغرفة</h2>
          <div class="field-group">
            <label>كود الغرفة (6 أرقام)</label>
            <input type="text" id="join-code" placeholder="مثال: 483920" maxlength="6">
          </div>
          <div class="field-group">
            <label>اسم اللاعب</label>
            <input type="text" id="join-name" placeholder="أدخل اسمك...">
          </div>
          <button class="secondary" onclick="handleJoinRoom()">انضمام للغرفة ⚡</button>
        </div>

      </div>

      <!-- الألعاب -->
      <div class="card">
        <h2>🎮 الألعاب المتاحة</h2>
        <div id="games-container" class="games-grid">
          <div style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 1.5rem;">
            جاري جلب قائمة الألعاب...
          </div>
        </div>
      </div>
    </div>

    <!-- شاشة اللوبي -->
    <div id="lobby-view" class="view">
      <div class="card">
        <div class="lobby-box">
          <span id="lobby-game-title" style="color: var(--text-muted); font-size: 0.95rem; font-weight: 700;">اسم اللعبة</span>
          <div class="code-display">
            <span id="lobby-code" class="code-number">------</span>
            <button onclick="copyCode()" class="secondary" style="width: auto; padding: 0.4rem 0.9rem; font-size: 0.85rem; border-radius: 20px;">
              📋 نسخ
            </button>
          </div>
          <p style="color: var(--text-muted); font-size: 0.9rem;">شارك الكود أعلاه مع أصدقائك للانضمام</p>
        </div>

        <h3 style="font-family: 'Changa', sans-serif;">اللاعبون المتواجدون (<span id="players-count" style="color: var(--neon-cyan);">0</span>)</h3>
        <div id="players-container" class="players-grid"></div>

        <div class="grid-2" style="margin-top: 2rem;">
          <button class="secondary" onclick="leaveRoom()">مغادرة الغرفة</button>
          <button id="start-game-btn" onclick="startGame()">بدء اللعبة الآن 🔥</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const API_BASE = 'https://saqrr.sindazon.workers.dev';
    let currentRoom = null;
    let currentPlayer = null;
    let lobbyInterval = null;

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    async function loadGames() {
      try {
        const res = await fetch(`${API_BASE}/api/games`);
        const result = await res.json();

        if (result.success && result.data) {
          const select = document.getElementById('create-game-id');
          const grid = document.getElementById('games-container');
          
          select.innerHTML = '<option value="">اختر لعبة من القائمة...</option>';
          grid.innerHTML = '';

          result.data.forEach(game => {
            select.innerHTML += `<option value="${game.id}">${game.title}</option>`;
            grid.innerHTML += `
              <div class="game-card" onclick="selectGame(${game.id})">
                <div class="game-title">${game.title}</div>
                <div class="game-meta">
                  <span class="badge">${game.category || 'عام'}</span>
                  <span style="color: #fef08a; font-weight: 700;">⭐ ${game.rating || 5.0}</span>
                </div>
              </div>
            `;
          });
        }
      } catch (err) {
        console.error('خطأ في جلب الألعاب:', err);
      }
    }

    function selectGame(gameId) {
      document.getElementById('create-game-id').value = gameId;
      document.getElementById('create-host').focus();
    }

    async function handleCreateRoom() {
      const host_name = document.getElementById('create-host').value.trim();
      const game_id = document.getElementById('create-game-id').value;

      if (!host_name || !game_id) {
        alert('يرجى كتابة اسم المستضيف واختيار اللعبة');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/rooms/create`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ game_id, host_name })
        });
        const result = await res.json();

        if (result.success && result.room) {
          currentRoom = result.room;
          currentPlayer = { player_name: host_name, is_host: true };
          enterLobby();
        } else {
          alert('خطأ أثناء إنشاء الغرفة');
        }
      } catch (err) {
        alert('تعذر الاتصال بالخادم');
      }
    }

    async function handleJoinRoom() {
      const room_code = document.getElementById('join-code').value.trim();
      const player_name = document.getElementById('join-name').value.trim();

      if (!room_code || !player_name) {
        alert('يرجى كتابة كود الغرفة واسمك');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/rooms/join`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room_code, player_name })
        });
        const result = await res.json();

        if (result.success) {
          currentRoom = result.room || { room_code, host_name: 'المستضيف' };
          currentPlayer = result.player || { player_name, is_host: false };
          enterLobby();
        } else {
          alert(result.message || 'خطأ في الانضمام للغرفة');
        }
      } catch (err) {
        alert('تعذر الاتصال بالخادم');
      }
    }

    function enterLobby() {
      showView('lobby-view');
      document.getElementById('lobby-code').innerText = currentRoom ? currentRoom.room_code : '------';
      
      const startBtn = document.getElementById('start-game-btn');
      startBtn.style.display = (currentPlayer && currentPlayer.is_host) ? 'flex' : 'none';

      renderLobbyPlayers();
      lobbyInterval = setInterval(renderLobbyPlayers, 3000);
    }

    // دالة حماية مضاعفة لمنع undefined
    function renderLobbyPlayers() {
      if (!currentRoom && !currentPlayer) return;

      const container = document.getElementById('players-container');
      const hostName = (currentRoom && currentRoom.host_name) 
        ? currentRoom.host_name 
        : (currentPlayer ? currentPlayer.player_name : 'المستضيف');

      document.getElementById('players-count').innerText = '1';

      container.innerHTML = `
        <div class="player-tag host">
          👑 ${hostName} (المستضيف)
        </div>
      `;
    }

    function copyCode() {
      const code = document.getElementById('lobby-code').innerText;
      navigator.clipboard.writeText(code);
      alert('تم نسخ الكود: ' + code);
    }

    function leaveRoom() {
      clearInterval(lobbyInterval);
      currentRoom = null;
      currentPlayer = null;
      showView('home-view');
    }

    function startGame() {
      alert('جاهز لبدء اللعبة التفاعلية!');
    }

    window.addEventListener('DOMContentLoaded', loadGames);
  </script>
</body>
</html>
